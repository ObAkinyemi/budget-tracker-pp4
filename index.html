<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Budget Tracker</title>
    <meta name="description" content="Simple Budget Tracker">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Budget Input -->
    <div>
        <label for="BudgetInput">What's Your Budget?</label>
        <input id="BudgetInput" type="number" placeholder="Enter Budget">
        <button id="budget_button">Set Budget</button> 
    </div>

    <hr>

    <!-- Add Expense -->
    <div>
        <h3>Add Expense</h3>
        <input type="text" placeholder="Expense Name" id="expense_name">
        <input type="number" placeholder="Expense Worth" id="expense_worth">
        <select id="expense_type">
            <option value="">Select Expense Type</option>
            <option value="personal">Personal</option>
            <option value="family">Family</option>
            <option value="fixed">Recurring</option>
        </select>
        <button id="add_exp_button">Add Expense</button>
    </div>

    <hr>

    <!-- Add Investment -->
    <div>
        <h3>Add Investment</h3>
        <input type="text" placeholder="Investment Name" id="investment_name">
        <input type="number" placeholder="Investment Worth" id="investment_worth">
        <select id="investment_type">
            <option value="">Select Investment Type</option>
            <option value="personal">Personal</option>
            <option value="family">Family</option>
            <option value="business">Business</option>
            <option value="retirement">Retirement/Compounding</option>
        </select>
        <button id="add_inv_button">Add Investment</button> 
    </div>

    <hr>

    <!-- Display Budget and Net Worth -->
    <div id="budget-disp">
        <h2>Budget Summary</h2>
        <p>Budget and net worth info will appear here.</p>
    </div>

    <!-- JavaScript -->
    <script src="script.js" async defer></script>
</body>
</html>
